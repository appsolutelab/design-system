<html><head><meta charset="utf-8"><title>Kbd</title></head>
<body>
<div id="root" class="ap-row"></div>
<script>
  var A = window.Appsolute, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(A.Kbd, { keys: ['Ctrl', 'K'] }),
    h(A.Kbd, { keys: ['Ctrl', 'Maiusc', 'N'] }),
    h(A.Kbd, null, 'Esc'),
    h('span', { style: { color: 'var(--ink-muted)' } }, 'Cerca ovunque ', h(A.Kbd, { keys: ['Ctrl', 'K'] }))));
</script>
