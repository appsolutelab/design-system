<!doctype html>
<html><head><meta charset="utf-8"><title>SettingsRow</title><style>body{padding:var(--space-6)}</style></head>
<body>
<div id="root"></div>
<script>
  var A = window.WingPal, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(A.SettingsGroup, { title: 'Aspetto' },
    h(A.SettingsRow, { label: 'Tema', description: 'Segue il sistema operativo finché non lo scegli tu.' }, h(A.ThemeToggle, null)),
    h(A.SettingsRow, { label: 'Lingua' }, h(A.LangSwitch, null)),
    h(A.SettingsRow, { label: 'Copia di sicurezza', description: 'Ultima copia: oggi alle 15:10' }, h(A.Button, { size: 'sm' }, 'Esporta i dati')),
    h(A.SettingsRow, { label: 'Elimina tutti i dati', description: 'Eventi, note e attività di questo computer. Non si può annullare.', tone: 'danger' }, h(A.Button, { size: 'sm', variant: 'danger' }, 'Elimina'))));
</script>
</body></html>
