<html><head><meta charset="utf-8"><title>TextField</title></head>
<body>
<div id="root" class="ap-stack"></div>

  var A = window.Appsolute, h = React.createElement;

    h(A.TextField, { label: 'Luogo', placeholder: 'Es. Palestra, Aula 3B', hint: 'Facoltativo' }),

    h(A.TextField, { label: 'Descrizione', multiline: true, rows: 3, defaultValue: 'Portare il portatile.\nRicordare la demo.' })));
</script>
