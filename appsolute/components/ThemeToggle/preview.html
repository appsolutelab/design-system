<html><head><meta charset="utf-8"><title>ThemeToggle</title></head>
<body>
<div id="root"></div>
<script>

    h('span', { className: 'small', style: { color: 'var(--ink-muted)' } }, 'Cambia il tema di questa anteprima')));
</script>
</body></html>
